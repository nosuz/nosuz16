services:
  dev:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
      target: dev
      args:
        LLVM_BUILD_JOBS: ${LLVM_BUILD_JOBS:-2}
        CODEX_BUST: ${CODEX_BUST:-0}
        CLAUDE_BUST: ${CLAUDE_BUST:-0}
    command: sleep infinity
    volumes:
      - ..:/workspaces
